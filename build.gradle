loom {
    accessWidenerPath = file("src/main/resources/architects_assembly.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    common(project(path: ':core', configuration: 'namedElements')) { transitive false }
    common(project(path: ':flora-and-fauna', configuration: 'namedElements')) { transitive false }
}